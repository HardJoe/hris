services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - backend-node/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  backend-node:
    build:
      context: .
      dockerfile: backend-node/Dockerfile
    restart: unless-stopped
    env_file:
      - backend-node/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOAD_DIR: /workspace/backend-node/uploads
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - certificate_uploads:/workspace/backend-node/uploads
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

volumes:
  postgres_data:
  certificate_uploads:

networks:
  backend:
    driver: bridge

