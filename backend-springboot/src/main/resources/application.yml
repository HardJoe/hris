server:
  port: ${PORT:3000}
  max-http-request-header-size: 16KB

spring:
  application:
    name: hris-backend-springboot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hris}
    username: ${POSTGRES_USER:hris_app}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:5242880}
      max-request-size: ${MAX_UPLOAD_BYTES:5242880}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /docs/openapi.json
  swagger-ui:
    path: /docs

hris:
  jwt:
    secret: ${JWT_SECRET:replace-this-development-secret-with-32-chars}
    expires-in: ${JWT_EXPIRES_IN:15m}
    issuer: ${JWT_ISSUER:hris-api}
    audience: ${JWT_AUDIENCE:hris-web}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-bytes: ${MAX_UPLOAD_BYTES:5242880}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
